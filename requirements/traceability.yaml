# Every requirement ID must map to at least one test.
# check_traceability.py fails CI if any ID is uncovered.

requirements:
  - id: BR-01
    description: "Robot reaches goal within 0.15m Euclidean distance"
    tests:
      # Session 10 implemented this as test_navigation_succeeds, not the placeholder name
      # below that was never updated to match. It checks the NavigateToPose action result
      # (status == SUCCEEDED), which requires reaching the goal within xy_goal_tolerance.
      - tests/test_navigation.py::test_navigation_succeeds
  - id: BR-02
    description: "Zero collisions per navigation run"
    tests:
      - tests/test_navigation.py::test_no_collision
  - id: BR-03
    description: "Recovery behavior completes within 10s if triggered"
    tests:
      # Genuinely not implemented — recovery behaviors (spin/backup) are broken
      # ("Pose Goes Off Grid" on every attempt, root cause not yet found). Tracked as
      # deferred work in Release1Todo.md Session 16+. This requirement stays failing
      # (not skipped — it's a real gap, not a profile limitation) until that's fixed;
      # stage-0's traceability step has continue-on-error for this reason.
      - tests/test_navigation.py::test_recovery_timeout
  - id: BR-04
    description: "/robot_001/odom publishes at >= 50 Hz"
    tests:
      - tests/test_ros2_contracts.py::test_odom_message_schema
  - id: BR-07
    description: "nav_success_rate >= 95% over rolling 20 runs"
    tests:
      - tests/test_baseline.py::test_drift_detected_above_threshold
  - id: BR-10
    description: "Nav2 behavior tree returns SUCCESS"
    tests:
      # Same underlying check as BR-01 — the NavigateToPose action result status
      # (SUCCEEDED) *is* the BT's overall success/failure outcome.
      - tests/test_navigation.py::test_navigation_succeeds
  - id: SC-04
    description: "/robot_001/scan publishes at >= 10 Hz"
    tests:
      - tests/test_ros2_contracts.py::test_scan_message_schema
  - id: SC-05
    description: "/robot_001/camera/image_raw publishes at >= 10 Hz"
    tests:
      - tests/test_ros2_contracts.py::test_camera_image_schema
