name: Fleet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stage-0-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Traceability gate
        run: |
          python tools/check_traceability.py \
            requirements/traceability.yaml \
            tests/ \
            --profile robot_profiles/jetson_ugv_pt.yaml \
            --json > reports/traceability_latest.json
          cat reports/traceability_latest.json

      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-report
          path: reports/traceability_latest.json

  stage-1-quality:
    runs-on: ubuntu-latest
    needs: stage-0-requirements
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ROS2 apt repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common curl
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu \
            $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | \
            sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update -qq

      - name: Install ament lint tools
        run: |
          sudo apt-get install -y \
            ros-jazzy-ament-flake8 \
            ros-jazzy-ament-pep257 \
            ros-jazzy-ament-copyright

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt flake8

      - name: Lint nav_fleet package
        run: |
          source /opt/ros/jazzy/setup.bash
          cd src/nav_fleet
          python -m flake8 nav_fleet/ --max-line-length=99
          python -m flake8 test/ --max-line-length=99

      - name: Run Python unit tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_ros2_contracts.py \
            -k "not integration"

  stage-2-arm64:
    runs-on: ubuntu-latest
    needs: stage-1-quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record build time
        run: |
          END=$(date +%s)
          BUILD_S=$((END - BUILD_START))
          echo "Stage 2 arm64 build time (QEMU): ${BUILD_S}s"
          echo "### Stage 2 arm64 (QEMU) build time: ${BUILD_S}s" >> $GITHUB_STEP_SUMMARY

  stage-3-gazebo:
    name: "Stage 3 — Gazebo Simulation Navigation"
    runs-on: [self-hosted, x86, gpu, rtx5080]
    needs: stage-2-arm64
    timeout-minutes: 30
    env:
      DISPLAY: ':0'
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    steps:
      - uses: actions/checkout@v4

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash

      - name: Launch Gazebo + Nav2 (headless)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 launch src/nav_fleet/launch/sim_launch.py headless:=true &
          sleep 20

      - name: Run navigation integration tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python -m pytest tests/test_navigation.py -v --timeout=120

      - name: Shutdown Gazebo
        if: always()
        run: pkill -f "gz sim" || true

  stage-4-isaac:
    name: "Stage 4 — Isaac Sim ROS2 Bridge Validation"
    runs-on: [self-hosted, x86, gpu, rtx5080]
    needs: stage-3-gazebo
    timeout-minutes: 10
    env:
      OMNI_KIT_ACCEPT_EULA: "YES"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    steps:
      - uses: actions/checkout@v4

      - name: Launch Isaac Sim robot (odom + scan)
        run: |
          source /opt/ros/jazzy/setup.bash
          source ~/isaac-env/bin/activate
          python scripts/isaac_robot.py &
          ISAAC_PID=$!
          # Wait for topics to appear (up to 90 s)
          for i in $(seq 1 45); do
            ros2 topic list 2>/dev/null | grep -q "robot_001/odom" && break
            sleep 2
          done

      - name: Verify odom Hz >= 50
        run: |
          source /opt/ros/jazzy/setup.bash
          RATE=$(timeout 6 ros2 topic hz /robot_001/odom 2>/dev/null \
            | grep "average rate" | tail -1 | awk '{print $3}' | cut -d. -f1)
          echo "Odom Hz: $RATE"
          [ "${RATE:-0}" -ge 50 ] || (echo "FAIL: odom Hz $RATE < 50" && exit 1)

      - name: Verify scan Hz >= 5
        run: |
          source /opt/ros/jazzy/setup.bash
          RATE=$(timeout 8 ros2 topic hz /robot_001/scan 2>/dev/null \
            | grep "average rate" | tail -1 | awk '{print $3}' | cut -d. -f1)
          echo "Scan Hz: $RATE"
          [ "${RATE:-0}" -ge 5 ] || (echo "FAIL: scan Hz $RATE < 5" && exit 1)

      - name: Stop Isaac Sim
        if: always()
        run: pkill -f "isaac_robot.py" || true
