name: Fleet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One pipeline at a time, ever (2026-07-18 finding): our runners are ONE physical
# workstation + ONE Jetson sharing DDS domain 0 — concurrent runs destroy each other
# (the PR-close + push-to-main pair fired by merging PR #4 both went red this way).
# Queue, never overlap, never cancel: a queued run waits for the machines.
#
# 2026-07-30: repo went public today after a git-filter-repo history rewrite (internal
# planning docs purged from every commit). The rewrite's own push had identical tree
# content, so the paths-filter below correctly skipped stages 3-4 — this comment forces
# a real full-pipeline run to confirm everything still works end-to-end post-rewrite.
#
# 2026-08-01: local dashboard showed FAIL rows (bedroom_nav drift, mission2_* variants)
# from a run contended by a concurrent synthetic-fleet Gazebo session on this same
# machine. Machine re-verified clear (no stray gz sim/robot_state_publisher processes,
# no in-flight CI). This comment forces a real full-pipeline run to confirm clean vs.
# a genuine regression.
#
# 2026-08-05: the docker-brain unification merge (HIL/real-robot converge onto one
# container) landed in one push, then a same-day one-line test fix landed in the NEXT
# push — paths-filter diffs each push against the ref it lands on, so the fix's push
# (touching only tests/) correctly found nothing in docker/src/tools/scripts changed
# and skipped stage-3-arm64/stage-4-hil, even though the actual container code (in the
# FIRST push, which never reached stage-3/4 because stage-1 failed there) has still
# never been run through them. This comment forces that real run, same pattern as the
# two entries above.
concurrency:
  group: fleet-ci-shared-hardware
  cancel-in-progress: false

jobs:
  changes:
    # Detects whether this push touches anything that actually affects the arm64 Docker image
    # (see Dockerfile — it only ever COPYs Dockerfile itself, requirements-ci.txt, src/, and tools/)
    # OR the HIL orchestration itself (scripts/** — hil_stage.sh, regen_cyclonedds_config.sh,
    # etc. — added 2026-07-31 after a hil_stage.sh-only push silently skipped the entire
    # arm64+HIL chain via this same filter, so a CycloneDDS interface-selection fix went
    # unverified for a full push/report cycle before anyone noticed it never actually ran).
    # A docs-only push (BLUEPRINT.md, Release1Todo.md, CLAUDE.md, etc.) has no reason to pay
    # stage-3-arm64's build cost at all (it's skipped outright via the `if:` below) — or the
    # ~15 min stage-4-hil now inherits by needing stage-3-arm64 (2026-07-10 renumber; HIL
    # replaced Isaac as stage-4 in Session 16, same inherited skip behavior).
    # Skipping the whole arm64+HIL chain for docs-only changes gets the run back to just
    # stage-0/1/2's ~4-5 minutes instead of waiting on work that couldn't have changed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'requirements-ci.txt'
              - 'src/**'
              - 'tools/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  stage-0-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Traceability gate
        # BR-03 (recovery behavior) has no test and can't yet — recovery (spin/backup) is
        # genuinely broken ("Pose Goes Off Grid" on every attempt), tracked as deferred work
        # in Release1Todo.md Session 16+. continue-on-error reports this honestly as a real,
        # tracked gap (not silently skipped via robot-profile skip_requirements, which is for
        # hardware capability differences, not implementation gaps) without blocking every
        # downstream stage on a known issue. Removing continue-on-error (and this gate
        # becoming a real, enforcing check) is explicit Release 2 scope, tied to BR-03's
        # recovery-behavior work landing then — not a Release 1 to-do, don't pull it forward.
        #
        # mkdir fix (2026-08-01): `reports/` is gitignored (generated-artifacts only), so a
        # fresh actions/checkout@v4 never has it on disk — the `>` redirect below used to fail
        # with "No such file or directory" BEFORE check_traceability.py ever ran, since the
        # very first commit that added this step. continue-on-error masked it as a silent
        # green no-op instead of a crash, so the traceability-report artifact has never once
        # actually been produced by CI. This mkdir is a pure mechanical fix — it makes the
        # step run and actually upload real (7/8-coverage, BR-03-missing) output instead of
        # crashing before it starts. It changes nothing about continue-on-error or blocking
        # behavior, so it carries no Release 1 risk.
        continue-on-error: true
        run: |
          mkdir -p reports
          python tools/check_traceability.py \
            requirements/traceability.yaml \
            tests/ \
            --profile robot_profiles/jetson_ugv_pt.yaml \
            --json > reports/traceability_latest.json
          cat reports/traceability_latest.json

      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-report
          path: reports/traceability_latest.json

  stage-1-quality:
    runs-on: ubuntu-latest
    needs: stage-0-requirements
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ROS2 apt repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common curl
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu \
            $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | \
            sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update -qq

      - name: Install ament lint tools
        run: |
          sudo apt-get install -y \
            ros-jazzy-ament-flake8 \
            ros-jazzy-ament-pep257 \
            ros-jazzy-ament-copyright

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt flake8

      - name: Lint nav_fleet package
        run: |
          source /opt/ros/jazzy/setup.bash
          cd src/nav_fleet
          python -m flake8 nav_fleet/ --max-line-length=99
          python -m flake8 test/ --max-line-length=99

      - name: Run Python unit tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_ros2_contracts.py \
            --ignore=tests/test_navigation.py \
            --ignore=tests/test_mission_run.py \
            --ignore=tests/test_nav_runner.py \
            --ignore=tests/test_esp32_driver.py \
            --ignore=tests/test_smoke_test.py \
            -k "not integration" \
            --cov=tools --cov=src/nav_fleet/nav_fleet --cov-report=term-missing

      # Combined stage-1+stage-2 coverage (2026-08-01, pure-local — Mike's call, no
      # third-party site): this stage's own .coverage data file is saved and passed
      # to the coverage-report job (below stage-2-gazebo) as a build artifact, which
      # runs `coverage combine` against both stages' data for the real merged total.
      # .coveragerc (repo root) scopes measurement to tools/ + src/nav_fleet/nav_fleet/
      # and omits the 3 hand-invoked hardware debug scripts.
      - name: Save stage-1 coverage data
        if: always()
        run: |
          COV_PCT=$(coverage report --format=total)
          echo "Stage 1 (unit) coverage: ${COV_PCT}%"
          echo "### Stage 1 (unit) coverage: ${COV_PCT}%" >> $GITHUB_STEP_SUMMARY
          mv .coverage coverage.stage1

      - name: Upload stage-1 coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-stage1
          path: coverage.stage1
          if-no-files-found: warn
          retention-days: 30

      # Canary (2026-07-25, Mike): this job's own $GITHUB_STEP_SUMMARY has never had
      # anything written to it before — added to directly test whether GitHub's Summary
      # page then renders THIS job's real content correctly, separately from the
      # stale/wrong-run drift-report content that's been observed appearing under this
      # job's panel (see Release1Todo.md Piece 9, "CI Summary-page mismapping"). Remove
      # once that's been visually confirmed on a live run.
      - name: Canary summary line
        run: echo "### Message from Mike" >> $GITHUB_STEP_SUMMARY

  stage-3-arm64:
    # needs stage-2-gazebo (not just stage-1-quality) as of 2026-07-10 — fail-fast: don't
    # spend ~10 min on a native arm64 build if the cheap, fast Gazebo nav check already
    # failed. See BLUEPRINT.md's decision log for the full pipeline-restructure rationale.
    # Job renumbered 2026-07-10 (was stage-2-arm64) so keys match execution order — Gazebo
    # runs first now, arm64 second.
    name: "Stage 3 — arm64 Native Build"
    runs-on: [self-hosted, arm64, jetson]
    needs: [stage-2-gazebo, changes]
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
            [[worker.oci.gcpolicy]]
              all = true
              keepBytes = 20000000000

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          # buildcache-v2 (2026-07-18): ref bumped to force the deliberate COLD build —
          # bumping the ref is the reliable cold lever when the token can't delete GHCR
          # cache versions. Old :buildcache is orphaned (S17 purge sweep).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-v2
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-v2,mode=max

      - name: Record build time
        run: |
          END=$(date +%s)
          BUILD_S=$((END - BUILD_START))
          echo "Stage 3 arm64 build time (native Jetson): ${BUILD_S}s"
          echo "### Stage 3 arm64 (native Jetson) build time: ${BUILD_S}s" >> $GITHUB_STEP_SUMMARY

  stage-2-gazebo:
    name: "Stage 2 — Gazebo Simulation Navigation"
    # Job renumbered 2026-07-10 (was stage-3-gazebo) — Gazebo runs right after stage-1 and
    # gates both arm64 and Isaac now, so it earned the lower number. Was needs:
    # (old)stage-2-arm64 originally — that forced every push to wait through a ~20+ min
    # emulated QEMU build before the sim tests even started. Un-gated back when arm64 moved
    # to native Jetson hardware (Session 14) and the dependency flipped the other direction —
    # arm64 now needs Gazebo to pass first (fail-fast), not the reverse. arm64 still hasn't
    # caught a genuinely arm64-specific bug (Session 08's two catches were both generic
    # Docker/CI-config issues) — the point of gating it behind Gazebo isn't distrust of
    # arm64, it's not spending ~10 real minutes building an image when the nav logic it
    # would carry is already known-broken.
    runs-on: [self-hosted, x86, gpu, rtx5080]
    needs: stage-1-quality
    timeout-minutes: 30
    env:
      DISPLAY: ':0'
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      SIM_ENGINE: gazebo
    steps:
      - uses: actions/checkout@v4

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash

      - name: Sweep stale sim processes (self-hosted runner shares the workstation)
        # Orphaned parameter_bridge / static TF / nav2 processes from crashed or killed
        # local debug runs attach to ANY new Gazebo via gz-transport (which has no DDS
        # domain isolation) and re-publish /clock + TF into this job's domain 0 — the
        # 2026-07-15 red run had 8,716 "jump back in time" warnings from exactly this,
        # presenting as "Goal rejected after all retries". Sweep before launch.
        run: |
          pkill -9 -f "parameter_bridge|component_container_isolated|ekf_node|ball_detector" || true
          pkill -9 -f "static_transform_publisher|robot_state_publisher" || true
          pkill -f "gz sim" || true
          sleep 3

      - name: Record start time
        run: echo "GAZEBO_START=$(date +%s)" >> $GITHUB_ENV

      - name: Launch Gazebo + Nav2 (headless)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # Capture launch output to a file: the backgrounded step's stdout is otherwise
          # lost once the step ends, so a failure window has zero Nav2 output to diagnose
          # (Session 16 — the first red run had no planner_server lines at all).
          : > /tmp/stage2_sim.log
          ros2 launch src/nav_fleet/launch/sim_launch.py \
            > /tmp/stage2_sim.log 2>&1 &
          sleep 20

      - name: Run navigation + mission integration tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          source ~/fleet-env/bin/activate   # pinned pytest 8.3.2 — GHA steps don't source
                                             # .bashrc, so this runner falls back to apt's
                                             # pytest 7.4.4 (owned by colcon-core) otherwise
          python -m pytest tests/test_navigation.py tests/test_mission_run.py \
            tests/test_nav_runner.py -v --timeout=300 \
            --cov=tools --cov=src/nav_fleet/nav_fleet --cov-report=

      - name: Run Mission 2 day (in-process — VLM canary x86 coverage)
        # tools/mission2_day.py's run_day() is now the ONLY place Mission 2's 3
        # legs (no_ball/yellow/red) actually run in this stage — the old standalone
        # tests/test_mission2.py per-scenario tests were removed (2026-08-01) as
        # redundant: same 3 legs, same judging, but this in-process run also covers
        # the VLM/Ollama canary path, which the old tests never exercised at all
        # (previously only ran on the real Jetson in stage-4-hil). --no-launch
        # reuses the stack the "Launch Gazebo + Nav2" step above already brought up,
        # matching how JetsonExecutor also implies no-launch (hil_stage.sh owns the
        # HIL stack). Telemetry runs normally here (no FLEET_TELEMETRY=off) —
        # mission2_* is declared under pipeline_matrix.yaml's sim stage
        # (runner_type=local), so this is now the sole source feeding the
        # local+mission2_* drift baseline (previously duplicated by the removed
        # tests). This also gives stage-5-reports-sim a real `runs` row to join the
        # VLM canary result against via find_run_photos()/find_vlm_canary_results().
        env:
          STATE_DIR: /tmp/stage2_mission2_day
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          source ~/fleet-env/bin/activate
          # coverage run -a appends to the SAME .coverage data file the pytest step
          # above wrote (both run from repo root — no explicit COVERAGE_FILE needed),
          # so stage 2's coverage picture includes the VLM-canary/mission-day code
          # path, not just what the pytest integration tests themselves touch.
          coverage run -a -m tools.mission2_day --executor inprocess --no-launch

      - name: Show mission2_day log tail on failure
        if: failure()
        run: tail -n 80 /tmp/stage2_mission2_day/mission2_day.log 2>/dev/null || true

      - name: Upload mission2_day log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-mission2-day-log-${{ github.run_number }}
          path: /tmp/stage2_mission2_day/mission2_day.log
          if-no-files-found: warn

      # Combined stage-1+stage-2 coverage (2026-08-01, pure-local) — see the matching
      # comment in stage-1-quality. This stage's .coverage already includes both the
      # pytest integration tests AND the mission2_day in-process run (coverage run -a
      # above appended to it) — saved and uploaded the same way for the coverage-
      # report job (below) to combine with stage-1's data for the real merged total.
      - name: Save stage-2 coverage data
        if: always()
        run: |
          source ~/fleet-env/bin/activate
          COV_PCT=$(coverage report --format=total 2>/dev/null || echo "n/a")
          echo "Stage 2 (integration) coverage: ${COV_PCT}%"
          echo "### Stage 2 (integration) coverage: ${COV_PCT}%" >> $GITHUB_STEP_SUMMARY
          mv .coverage coverage.stage2 2>/dev/null || true

      - name: Upload stage-2 coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-stage2
          path: coverage.stage2
          if-no-files-found: warn
          retention-days: 30

      - name: Record Gazebo timing
        if: always()
        run: |
          END=$(date +%s)
          GAZEBO_S=$((END - GAZEBO_START))
          echo "Stage 2 Gazebo (headless, cold start through 3 tests): ${GAZEBO_S}s"
          echo "### Stage 2 Gazebo wall time: ${GAZEBO_S}s" >> $GITHUB_STEP_SUMMARY

      - name: Show sim log tail on failure
        if: failure()
        run: tail -n 60 /tmp/stage2_sim.log 2>/dev/null || true

      - name: Upload sim launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-sim-log-${{ github.run_number }}
          path: /tmp/stage2_sim.log
          if-no-files-found: warn

      - name: Shutdown sim (full pattern — a bare "gz sim" pkill leaves bridge/TF orphans)
        if: always()
        run: |
          pkill -9 -f "parameter_bridge|component_container_isolated|ekf_node|ball_detector" || true
          pkill -9 -f "static_transform_publisher|robot_state_publisher" || true
          pkill -f "gz sim" || true

  coverage-report:
    name: "Combined coverage (stage-1 unit + stage-2 integration)"
    # Pure-local replacement for an earlier Codecov-hosted design (2026-08-01, Mike's
    # call — no third-party site holding coverage data). Downloads both stages'
    # .coverage data files (uploaded as build artifacts above) and runs `coverage
    # combine` for the real merged total — not double-counted, since the two stages
    # run non-overlapping test files (Item 1 audit, CLAUDE.md). Self-hosted only
    # because that's where the fleet-env venv already lives; no Gazebo/GPU work
    # happens in this job. Runs even if stage-2-gazebo FAILED (best-effort, same
    # pattern as stage-5-reports-hw) so a broken run's coverage data still surfaces.
    runs-on: [self-hosted, x86, gpu, rtx5080]
    needs: stage-2-gazebo
    if: ${{ !cancelled() && needs.stage-2-gazebo.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage data (stage 1 + stage 2)
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-stage*
          merge-multiple: true

      - name: Combine + compute per-stage and combined percentages
        run: |
          source ~/fleet-env/bin/activate
          STAGE1_PCT=$(COVERAGE_FILE=coverage.stage1 coverage report --format=total 2>/dev/null || echo "n/a")
          STAGE2_PCT=$(COVERAGE_FILE=coverage.stage2 coverage report --format=total 2>/dev/null || echo "n/a")
          coverage combine coverage.stage1 coverage.stage2
          COMBINED_PCT=$(coverage report --format=total)
          coverage report -m
          coverage html
          echo "STAGE1_PCT=${STAGE1_PCT}" >> $GITHUB_ENV
          echo "STAGE2_PCT=${STAGE2_PCT}" >> $GITHUB_ENV
          echo "COMBINED_PCT=${COMBINED_PCT}" >> $GITHUB_ENV
          echo "Combined coverage: stage1=${STAGE1_PCT}% stage2=${STAGE2_PCT}% combined=${COMBINED_PCT}%"
          echo "### Combined coverage: ${COMBINED_PCT}% (stage1=${STAGE1_PCT}%, stage2=${STAGE2_PCT}%) — full browsable report: coverage-html artifact below" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ github.run_number }}
          path: htmlcov/
          retention-days: 30

      - name: Log coverage trend
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.coverage_log \
            --stage1-pct "${STAGE1_PCT}" --stage2-pct "${STAGE2_PCT}" \
            --combined-pct "${COMBINED_PCT}" \
            --commit-sha "${{ github.sha }}" --ci-run-number "${{ github.run_number }}"

  stage-4-hil:
    name: "Stage 4 — HIL: Gazebo (x86) ↔ Nav2 + Mission 2 day (no_ball + yellow + red, real Jetson)"
    # Replaces the prior Isaac Sim job (retired 2026-07 — Session 16; scripts stay in
    # git/on disk). One job on the x86 runner drives the Jetson over SSH as a lab
    # instrument — see docs/session15-hil-ci-stage-design.md for every decision
    # (orchestration §1, pass/fail §2, timeouts+teardown §3, naming §4). All logic lives
    # in scripts/hil_stage.sh so the stage is runnable/debuggable locally.
    # Skips on docs-only pushes (inherits stage-3-arm64's `changes` gate) — same
    # accepted behavior the retired Isaac job had.
    runs-on: [self-hosted, x86, gpu, rtx5080]
    needs: stage-3-arm64
    # Budget arithmetic (Task 13b/d: Mission 1 dropped from stage-4 — it stays as stage-2
    # regression, tests/test_mission_run.py; stage-4 runs ONLY the Mission 2 day). One `run`
    # gate brings the stack up ONCE; the `day` orchestrator reuses it for all three runs:
    #   run gate: clean + sim 60 + nav2 120 = ~3 min (no mission, no retry).
    #   day: no_ball round trip ~3 (out+back+3 photos) + yellow ~2.5 (out+react+back, with the
    #     concurrent yellow->red swap) + red ~2 (out+react, stays) + judges/scp/pair-check
    #     + hold 0 = ~8 min.
    #   Teardown ~1.5 min. Total ~12-13 min. No whole-mission retry exists any more (Task 13a
    #     put the only retry in-process in nav_runner), so there is no retry multiplier.
    # 20 minutes leaves generous headroom without masking a genuine hang — the day's ssh
    # mission keeps its own `timeout 1080` inner cap (18 min, 2 min under this job's outer
    # limit) so a stuck day still fails fast at its own boundary.
    timeout-minutes: 20
    # phase 2: the mission runs inside the stage-3 arm64 GHCR image (private) — the Jetson
    # needs to pull it, so GITHUB_TOKEN needs read:packages.
    permissions:
      contents: read
      packages: read
    env:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "0"
      JETSON_USER: mike
      POWER_MODE_ID: "1"          # 25W always (Mike, 2026-07-31) — HIL is wall-powered, no
                                  # battery budget to test against; the real robot's own
                                  # short (<30min) field experiments also stay at 25W too, so
                                  # this is real deployment power now, not just build power.
                                  # CI never calls `nvpmodel -m` at all any more (2026-07-31,
                                  # second pass) — the Jetson is set to 25W once, by hand,
                                  # outside CI, and left alone permanently; this var is now
                                  # only real_power_mode_label()'s fallback label if its own
                                  # live `nvpmodel -q` (read-only, no reboot risk) ever fails.
                                  # The earlier fix here still called `nvpmodel -m` as a
                                  # "safety net" step even though the target mode never
                                  # changed — that SET call is exactly what still tripped
                                  # nvpmodel's stuck reboot-confirmation bug (CLAUDE.md
                                  # Gotchas); removing the calls, not just picking a number,
                                  # is what actually removes the failure class.
      STATE_DIR: /tmp/hil_stage
      HIL_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      # The day's JUDGED verdict rows (mission2_no_ball / _yellow / _red) are logged HERE on
      # the workstation (where the judge runs) directly into the shared drift DB — no SSH row-
      # shipping needed any more (Task 13d). Same persistent DB stage-2/5 use (the default
      # owned by tools/telemetry_logger.DB_PATH, Session 17 Foundation piece) so
      # baseline_monitor tracks HIL trends and stage-5-reports-hw is genuinely hardware-fed.
    steps:
      - uses: actions/checkout@v4

      - name: Discover Jetson (DHCP lease — never hard-coded)
        run: |
          JETSON_IP=$(scripts/hil_stage.sh discover)
          echo "JETSON_IP=${JETSON_IP}" >> $GITHUB_ENV
          echo "Jetson at ${JETSON_IP}"

      - name: Sync the commit under test on the Jetson
        run: scripts/hil_stage.sh sync ${{ github.sha }}

      - name: Pull the stage-3 arm64 image onto the Jetson (phase 2 — mission runs in-container)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new ${JETSON_USER}@${JETSON_IP} \
              "docker login ghcr.io -u ${{ github.actor }} --password-stdin && docker pull ${HIL_IMAGE}"

      - name: Build x86 workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Record start time
        run: echo "HIL_START=$(date +%s)" >> $GITHUB_ENV

      - name: Bring up the HIL stack (sim on x86 → Nav2 on the Jetson — gate only, Task 13b)
        run: scripts/hil_stage.sh run

      - name: "Mission 2 day (HIL orchestrator: no_ball → yellow → red, Task 13d)"
        run: scripts/hil_stage.sh day

      - name: Record HIL timing
        if: always()
        run: |
          END=$(date +%s)
          HIL_S=$((END - HIL_START))
          echo "Stage 4 HIL wall time: ${HIL_S}s"
          echo "### Stage 4 HIL wall time: ${HIL_S}s" >> $GITHUB_STEP_SUMMARY

      - name: Fetch Jetson Nav2 logs (the autopsy — MUST precede the artifact upload)
        if: always()
        run: |
          # The per-run Nav2 logs are now written directly into the container's reports/
          # bind-mount and land in the Jetson's ~/autonomous-fleet-testbed/reports/ with
          # a timestamp suffix. Best-effort: never fail the job.
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new ${JETSON_USER}@${JETSON_IP}:~/autonomous-fleet-testbed/reports/nav2_container_*.log /tmp/hil_stage/ || true
          ls -la /tmp/hil_stage/nav2_container_*.log 2>/dev/null || echo "no Jetson nav2 logs fetched"

      - name: Ingest on-Jetson VLM canary result (real on-device inference, 2026-07-31)
        # JetsonExecutor spawns the actual classification ON THE JETSON (its own Ollama/
        # CUDA install — the whole point of an "on-device" canary), fire-and-forget, so
        # it may still be running when the mission itself finishes. Placed as late as
        # possible (after the Nav2 log fetch above) to give it the most wall-clock time
        # before this best-effort pull-back. Missing result = not run yet / no red
        # reaction today / Ollama not installed — never fails the job.
        if: always()
        run: |
          source /opt/ros/jazzy/setup.bash
          # install/setup.bash may not exist if an earlier step in this job's cascade
          # was itself skipped (e.g. nvpmodel blocked everything upstream) — `|| true`
          # here (not relying on set -e's exact && short-circuit semantics) guarantees
          # this line never aborts the step either way.
          [ -f install/setup.bash ] && source install/setup.bash || true
          source ~/fleet-env/bin/activate
          python -m tools.mission2_day --ingest-vlm-canary || true

      - name: Upload mission evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-mission-evidence-${{ github.run_number }}
          path: |
            /tmp/hil_stage/*.png
            /tmp/hil_stage/sim.log
            /tmp/hil_stage/mission2_day.log
            /tmp/hil_stage/day.out
            /tmp/hil_stage/nav2_container_*.log
            /tmp/hil_stage/vlm_canary_last_result.json
            reports/photos/*.png
            reports/failure_bags/**
          if-no-files-found: warn
          retention-days: 30

      - name: Prune old local docker images on the Jetson (keep current + last 2)
        # Piece 6: every run pulls a new uniquely-tagged arm64 image onto the Jetson
        # (the "Pull the stage-3 arm64 image" step above) and nothing ever removes an
        # old one. Unlike GHCR (tools/ghcr_prune.py + ghcr-cleanup.yml, report-only by
        # design), this is local disk on real hardware with no registry-permanence
        # concern, so a small rolling-window prune here is safe to run every run.
        # Never touches :latest. Best-effort: never fails the job.
        if: always()
        run: |
          REPO="${HIL_IMAGE%:*}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new ${JETSON_USER}@${JETSON_IP} bash -s -- "$REPO" <<'REMOTE' || true
            repo="$1"
            docker images "$repo" --format '{{.ID}};{{.Tag}};{{.CreatedAt}}' \
              | grep -v ';latest;' \
              | sort -t';' -k3 -r \
              | tail -n +3 \
              | cut -d';' -f1 \
              | xargs -r docker rmi -f
          REMOTE

      - name: Show sim log tail on failure
        if: failure()
        run: tail -n 60 /tmp/hil_stage/sim.log 2>/dev/null || true

      - name: Teardown (both sides, unconditional)
        if: always()
        run: scripts/hil_stage.sh teardown

      - name: Restore Jetson checkout to main
        if: always()
        run: scripts/hil_stage.sh restore-checkout || true

  # Split into -sim and -hw (2026-07-10) so Gazebo's drift/report recording doesn't wait on
  # the slower arm64+hardware path — was one job needing the hardware-path job only, so a
  # sim-only result never got reported if the hardware path was skipped, slow, or failed. Both call
  # the same report/drift scripts against the same FLEET_DB; they just fire independently.
  # Note: both still run on the single self-hosted x86 GPU runner alongside stage-2/4, so
  # they're logically independent but not truly wall-clock-parallel with each other or with
  # stage-4 — only stage-3-arm64 (a separate Jetson runner) gets real hardware parallelism.
  stage-5-reports-sim:
    name: "Stage 5 — Workstation Reports + Dashboard"
    # Runs on the self-hosted runner, not ubuntu-latest: stage-2's nav tests write
    # telemetry to this runner's persistent DB (~/fleet-ci-data/fleet_runs.db, the
    # default owned by tools/telemetry_logger.DB_PATH), so a hosted job's fresh
    # checkout would have no run data — it would PDF an empty database.
    runs-on: [self-hosted, x86, gpu, rtx5080]
    needs: stage-2-gazebo
    env:
      REPORT_PATH: reports/sim-report-${{ github.run_number }}.pdf
    steps:
      - uses: actions/checkout@v4

      - name: Generate report (this run's own sim scenarios only, per Piece 4/6)
        # --stage sim reads runner-type + scenarios from config/pipeline_matrix.yaml
        # (Piece 6) instead of a hand-typed list here.
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.generate_test_report \
            --stage sim \
            --report-path "$REPORT_PATH"

      - name: Validate telemetry schema
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.validate_telemetry

      - name: Check baseline drift
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.baseline_monitor

      # Plain console-log output, deliberately NOT $GITHUB_STEP_SUMMARY — GitHub's
      # Summary tab has a confirmed platform bug showing stale/wrong-job content
      # (Release1Todo.md, 2026-07-23 + recurred 2026-07-25); the console log is the
      # reliable part of a run. See docs/superpowers/specs/2026-07-28-local-llm-
      # diagnosis-design.md.
      - name: Fleet status
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.fleet_status --stage sim --max-age-minutes 30

      - name: Upload PDF report
        id: upload_pdf
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}-sim
          # Glob, not the exact REPORT_PATH: generate_test_report appends a -DRIFT
          # suffix to the actual filename when a metric is flagged, which isn't known
          # until the step above runs — this must match either form.
          path: reports/sim-report-${{ github.run_number }}*.pdf
          retention-days: 30

      # Direct link (2026-07-25, Mike): the summary text above never mentioned the PDF
      # at all — a reader had to know to scroll to the run's Artifacts section, download
      # a zip, and extract it. upload-artifact@v4 exposes the artifact's own page URL as
      # a step output; this still downloads a zip (GitHub artifacts are always zipped,
      # no platform way around that), but it's a direct one-click link to the right
      # place instead of a manual hunt.
      - name: Link PDF report in summary
        run: echo "📄 [Download the PDF report](${{ steps.upload_pdf.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY

  # Phase 1 (now): the HIL telemetry row lives on the Jetson's local DB (printed to the
  # stage-4-hil log) — this job re-reports sim-path data after a hardware-path success,
  # same as it effectively did in the Isaac era. Phase 2 (Task 13): ship that row into the
  # workstation FLEET_DB so drift tracking sees real HIL runs, not just this re-report.
  stage-5-reports-hw:
    name: "Stage 5 — HIL Reports + Dashboard"
    runs-on: [self-hosted, x86, gpu, rtx5080]
    needs: stage-4-hil
    # Fair-weather fix part (a) (2026-07-18, pulled forward from S17 after biting twice in
    # one evening): run on stage-4 FAILURE too — failure telemetry is the most valuable
    # kind — but still skip when stage-4 was SKIPPED (docs-only pushes).
    if: ${{ !cancelled() && needs.stage-4-hil.result != 'skipped' }}
    env:
      REPORT_PATH: reports/hil-report-${{ github.run_number }}.pdf
    steps:
      - uses: actions/checkout@v4

      - name: Generate report (this run's own HIL scenarios only, per Piece 4/6)
        # --stage hil reads runner-type + scenarios from config/pipeline_matrix.yaml
        # (Piece 6) instead of a hand-typed list here.
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.generate_test_report \
            --stage hil \
            --report-path "$REPORT_PATH" \
            --evidence-artifact "hil-mission-evidence-${{ github.run_number }}"

      - name: Validate telemetry schema
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.validate_telemetry

      - name: Check baseline drift
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.baseline_monitor

      # Plain console-log output, deliberately NOT $GITHUB_STEP_SUMMARY — see the
      # matching comment in stage-5-reports-sim.
      - name: Fleet status
        run: |
          source ~/fleet-env/bin/activate
          python -m tools.fleet_status --stage hil --max-age-minutes 30

      - name: Upload PDF report
        id: upload_pdf
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}-hw
          path: reports/hil-report-${{ github.run_number }}*.pdf
          retention-days: 30

      # Direct link (2026-07-25, Mike): see the matching comment in stage-5-reports-sim.
      - name: Link PDF report in summary
        run: echo "📄 [Download the PDF report](${{ steps.upload_pdf.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
