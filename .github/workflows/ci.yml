name: Fleet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stage-0-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Traceability gate
        run: |
          python tools/check_traceability.py \
            requirements/traceability.yaml \
            tests/ \
            --profile robot_profiles/jetson_ugv_pt.yaml \
            --json > reports/traceability_latest.json
          cat reports/traceability_latest.json
        continue-on-error: true
        # ↑ Remove continue-on-error in Session 10 once all Session 09 tests pass

      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-report
          path: reports/traceability_latest.json

  stage-1-quality:
    runs-on: ubuntu-latest
    needs: stage-0-requirements
    steps:
      - uses: actions/checkout@v4
      - run: echo "Stage 1 stub — implement in Session 07"

  stage-2-arm64:
    runs-on: ubuntu-latest
    needs: stage-1-quality
    steps:
      - uses: actions/checkout@v4
      - run: echo "Stage 2 stub — implement in Session 08"

  stage-3-gazebo:
    runs-on: ubuntu-latest
    needs: stage-2-arm64
    steps:
      - uses: actions/checkout@v4
      - run: echo "Stage 3 stub — implement in Session 09"
