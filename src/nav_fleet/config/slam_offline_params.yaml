# slam_toolbox settings for building a map OFFLINE from a mapping-drive bag
# (scripts/build_map_from_bag.sh + tools/map_from_bag.py). Not used on the robot and
# not used by Nav2 -- the mission localizes with AMCL against the saved map.
#
# Differences from slam_toolbox's stock mapper_params_online_async.yaml, and why:
#   base_frame base_footprint / scan_topic /scan  -- what tools/map_from_bag.py publishes
#   use_sim_time true                              -- the feeder publishes bag time on /clock
#   min_laser_range 0.15, max_laser_range 8.0      -- same limits as nav_fleet.scan_motion:
#                                                     nearer is the robot's own mast edge,
#                                                     farther is noisier than a 5 cm cell
#   minimum_travel_distance 0.10 / heading 0.15    -- a new scan every 10 cm or ~9 deg; the
#                                                     drive is slow, so this is plenty
#   loop_search_maximum_distance 3.0               -- the house is small; do not try to
#                                                     close loops across rooms
# First used 2026-11-18: a 4-minute, 14 m teleop drive gave single-cell walls and a
# start/end agreement of 0.16 m without any tuning beyond the above.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 8.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.15
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
