# Settings for the RF-DETR detector when the pictures come from the GAZEBO camera
# (local simulator, CI's simulator stage, and the Jetson stage, where the pictures
# arrive from Gazebo over the network). Only what differs from the real camera's file
# (detector_rfdetr.yaml) is listed; everything else takes rfdetr_detect.DEFAULTS.
#
# Measured 2026-11-23 with the robot parked and a ball spawned straight ahead of the
# lens (reports/sim_rfdetr_20261123/): the network called every ball "sports ball"
# (scores 0.73-0.94, 0.5 m to 2.5 m, yellow and red), and the color step named all of
# them correctly with the REAL camera's bands: Gazebo's flat yellow is hue 60 and its
# red hue 0, both inside the bands above, so no color setting is needed here.

# The simulated camera is 640 pixels wide (the real one 1280) and has a different lens.
# Box width times distance, at 0.5 / 0.8 / 1.0 / 1.3 / 1.5 / 2.0 / 2.5 m:
# 44.0 / 45.6 / 46.5 / 46.8 / 46.5 / 48.0 / 47.5. The reactions fire at 0.8 m and
# 1.3 m, so the constant is taken there. The hand-written detector's own constant for
# this camera was 47.1 (hsv_gazebo.yaml).
ball_range_k: 46.5
range_reference_width_px: 640
