# nav2_params.yaml — Nav2 configuration for ugv_pt in bedroom world
#
# Base: BC/isaac_project nav2 params (tuned for 3.05x3.96m bedroom, proven working).
# Changes from BC project:
#   - use_sim_time: true  (Gazebo publishes /clock, not wall time)
#   - robot_radius: 0.15 → 0.20  (ugv_pt is larger than Jetbot)
#   - Frame IDs: base_link → robot_001/base_link, odom → robot_001/odom
#   - Scan/odom topics: /scan → /robot_001/scan, /odom → /robot_001/odom
#   - Added AMCL for localization against living_room.pgm map
#   - inflation_radius bumped slightly for ugv_pt clearance
#
# Map: maps/living_room.pgm (0.05m/px, origin [-3.0, 0.2, 0.0])
# Stage 4: when Isaac Sim is added, this file transfers unchanged — same room geometry.

amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "robot_001/base_footprint"
    odom_frame_id: "robot_001/odom"
    global_frame_id: "map"
    scan_topic: /robot_001/scan
    # Motion model noise — conservative for a wheeled UGV
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    save_pose_rate: 0.5
    set_initial_pose: true
    # Initial pose: hallway entrance (robot_001 spawn point)
    initial_pose:
      x: -1.276
      y: 1.09
      z: 0.0
      yaw: 1.5708  # facing North (+Y)
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.1
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: robot_001/base_link
    odom_topic: /robot_001/odom
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 60.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3   # slower than Jetbot (0.5) — ugv_pt is larger
      max_linear_accel: 1.0
      max_angular_vel: 1.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.20   # ugv_pt (was 0.15 for Jetbot)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /robot_001/scan
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25   # bumped from 0.20 for ugv_pt clearance

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      robot_radius: 0.20   # ugv_pt
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /robot_001/scan
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30   # bumped from 0.30 (same, provides clearance buffer)

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""  # set at launch time via launch argument

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "robot_001/base_footprint"
    odom_frame_id: "robot_001/odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/robot_001/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /robot_001/scan
