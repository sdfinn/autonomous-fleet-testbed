# nav2_params.yaml — Nav2 configuration for ugv_pt in bedroom world
#
# Base: BC/isaac_project nav2 params (tuned for 3.05x3.96m bedroom, proven working).
# Changes from BC project:
#   - use_sim_time: true  (Gazebo publishes /clock, not wall time)
#   - robot_radius 0.15 → 0.20 → 0.25 → rectangular footprint → back to robot_radius 0.24
#     with NavfnPlanner + a minimal one-shot BT (navigate_simple.xml). SmacPlannerHybrid +
#     AMCL + collision_monitor + recovery behaviors compounded into an unsolvable-in-one-
#     session tangle (behavior_server's recovery has a real, separate bug — "Pose Goes Off
#     Grid" — that surfaced independent of everything else). Reverted to the exact structure
#     proven working in BC/isaac_project (NavfnPlanner, plain robot_radius, no periodic
#     replanning, no recovery dependency) to get a real passing baseline. Deferred capability
#     (AMCL hardening, recovery, accurate footprint planning) tracked in Release1Todo.md
#     Session 16+ "Deferred Nav2 capability" — re-add one at a time with a green test each step.
#   - Frame IDs: odom, base_footprint, base_link (no prefix — per-robot TF topic isolates frames)
#   - Scan/odom topics: /scan → /robot_001/scan, /odom → /robot_001/odom
#   - Added AMCL for localization against living_room.pgm map
#   - inflation_radius bumped slightly for ugv_pt clearance
#
# Map: maps/living_room.pgm (0.05m/px, origin [-3.0, 0.2, 0.0])
# Stage 4: when Isaac Sim is added, this file transfers unchanged — same room geometry.

amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /robot_001/scan
    # Motion model noise — ASYMMETRIC, from measurement (Session 16, 2026-07-15).
    # This 4-wheel skid-steer chassis over-reports rotation ~30% during in-place
    # spins (controlled experiment: body turned 146.5° while wheel odom claimed
    # ~192° — lateral friction resists body rotation, wheels slip). Translation
    # odometry is sim-grade good. So: rotation-related noise (alpha1: rot-from-rot,
    # alpha4: trans-from-rot) stays HIGH to let scan matching correct the yaw lie;
    # translation-related noise (alpha2, alpha3) is LOW to keep the particle cloud
    # tight in the symmetric hallway (uniform 0.2 everywhere caused multi-modal
    # delocalization — Task 9c; uniform 0.05 made AMCL trust the rotation lie).
    # Real fix for the source: IMU+wheel-odom EKF fusion (IMU already in the URDF).
    alpha1: 0.2
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    save_pose_rate: 0.5
    set_initial_pose: true
    # Initial pose: hallway entrance (robot_001 spawn point)
    initial_pose:
      x: -1.276
      y: 1.2
      z: 0.0
      yaw: 1.5708  # facing North (+Y)
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.1
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    # EKF-fused odometry (Session 16 Task 9e) — not the raw wheel odom, whose yaw-rate
    # over-reports in-place rotation ~30% (measured; see config/ekf.yaml). The fused
    # estimate uses IMU gyro for the honest body-rotation rate.
    odom_topic: /robot_001/odometry/filtered
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # Minimal one-shot tree (matches BC/isaac_project reference) — compute path once, follow
    # once, no periodic replanning, no recovery dependency. The recovery-capable tree
    # (navigate_to_pose_recovery.xml) is kept in the repo for when behavior_server's
    # "Pose Goes Off Grid" bug is fixed (see Release1Todo.md Session 16+). Path is relative
    # to repo root, matching this launch file's existing pathlib.Path(__file__).parent.parent
    # convention (see CLAUDE.md).
    default_nav_to_pose_bt_xml: "src/nav_fleet/behavior_trees/navigate_simple.xml"

controller_server:
  ros__parameters:
    use_sim_time: true
    # EKF-fused odometry (Session 16 Task 9e) — the controller's velocity feedback (used
    # by RPP's regulated/rotate-to-heading logic) must read the honest body yaw-rate, not
    # the raw wheel odom that over-reports in-place rotation ~30% (see config/ekf.yaml).
    # Default would be /robot_001/odom (raw). Keep in sync with bt_navigator odom_topic.
    odom_topic: /robot_001/odometry/filtered
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    use_realtime_priority: false
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]   # Jazzy: plural param name
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 60.0
    goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3   # slower than Jetbot (0.5) — ugv_pt is larger
      max_linear_accel: 1.0
      max_angular_vel: 1.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      use_collision_detection: false        # true confirmed RPP's preemptive stop works
                                            # correctly at the Dresser corner, but recovery
                                            # (spin/backup) is broken — behavior_server's
                                            # costmap-subscriber check fails "Pose Goes Off
                                            # Grid" 100% of the time (separate, unresolved bug).
                                            # Any preemptive stop is a guaranteed deadlock with
                                            # no way out, so back to false: rely on the passive
                                            # collision_monitor slowdown instead, now paired with
                                            # the accurate footprint + SmacPlannerHybrid path.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.3     # 17° — triggers in-place rotation for the initial NNE heading error (~30°)
      # Slower in-place rotation (Session 16 Task 9e; default is 1.8 rad/s). A slower spin
      # means less wheel skid per radian AND more lidar scans per radian for AMCL to correct
      # against during the ~180° return-leg rotation. Also a first step toward "slow down
      # when uncertain" behavior (Mike, 2026-07-15). Sequenced after the EKF fix and measured
      # separately: EKF alone gave 0.14–0.15 m ground-truth misses; this held/improved them.
      rotate_to_heading_angular_vel: 0.5

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      # Reverted to NavfnPlanner (matches BC/isaac_project reference exactly) — SmacPlannerHybrid
      # is the more correct planner long-term (see Session 16+ notes) but its interaction with
      # AMCL + periodic replanning + recovery cost most of Session 11/12. NavfnPlanner is a
      # classic circular-footprint A*/Dijkstra planner; combined with the minimal one-shot BT
      # (navigate_simple.xml — no periodic replanning), it never re-checks "start occupied" from
      # an awkward mid-transit pose, which was the actual recurring failure.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3            # accept goal within 0.3m if exact cell is occupied
      use_astar: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Plain circular robot_radius (matches reference) — NavfnPlanner is circular-footprint
      # only anyway, so a rectangular footprint bought nothing here. 0.24 covers the chassis's
      # real diagonal (0.237m, from ugv_pt.urdf.xacro half-length 0.175 / half-width 0.16) with
      # a small margin — comfortably clears the 0.665m doorway (diameter 0.48m) since there's no
      # periodic replanning to catch it mid-turn anymore.
      robot_radius: 0.24
      robot_base_frame: "base_footprint"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /robot_001/scan
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      robot_radius: 0.24
      robot_base_frame: "base_footprint"
      # obstacle_layer restored (removed in Session 11 to fix a "Start occupied" bug that was
      # specific to periodic replanning accumulating live scan data mid-transit — the minimal
      # BT has no periodic replanning, so that failure mode no longer applies, and this now
      # matches the reference project exactly.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /robot_001/map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /robot_001/scan
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""  # set at launch time via launch argument

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Neutered, not removed — FootprintApproach sat between controller_server and Isaac in the
    # cmd_vel pipeline (cmd_vel_smoothed -> cmd_vel) and rewrote the outgoing command
    # independently of use_collision_detection above (that only controls RPP's own internal
    # abort). Once the robot got close enough that any nonzero speed read as "too close," it
    # clamped cmd_vel toward zero — and since the robot then wasn't moving, the distance never
    # changed, so the clamp never lifted (silent self-lock, no error logged, matches exactly
    # what was observed: one real command, then zero for ~225s).
    # The reference project sets polygons/observation_sources to [] — but that only worked
    # because its launch never actually starts collision_monitor as a live node. Ours does
    # (loaded as a composable node via nav2_bringup), and composable-node parameter loading
    # can't handle empty-list params ("Expected 'value' to be ... got '()' of type 'tuple'" —
    # the type can't be inferred from zero elements). So: one real polygon, sized 2cm square,
    # smaller than the lidar's own minimum range (0.12m) — no real scan point can ever fall
    # inside it, so it can never trigger. Functionally a no-op without an empty-list parameter.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
      time_before_collision: 0.1
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /robot_001/scan

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
